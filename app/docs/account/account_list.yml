Returns an array of all accounts with information.
---
definitions:
  AccountList:
    type: object
    properties:
      type: array
      items:
        $ref: "#/definitions/Account"
  Account:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      type:
        type: integer
      status:
        type: integer
      balance:
        type: integer
      can_be_deleted:
        type: boolean

tags:
  - Account
responses:
  200:
    description: A list of accounts with the following information
    schema:
      $ref: "#/definitions/AccountList"
  401:
    description: No user is logged in
  500:
    description: Internal server error
