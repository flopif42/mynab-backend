Returns an array of all accounts with various information.
---
tags:
  - Account
definitions:
  Account:
    type: object
    properties:
      id:
        type: integer
        description: The account number
      name:
        type: string
        description: The account name
      balance:
        type: integer
        description: The account balance in cents
      can_be_deleted:
        type: integer
        description: A boolean indicating if the account can be deleted
      status:
        type: integer
        description: "The account status (1 : Open, 0 : Closed)"
      type:
        type: integer
        description: "The type of account (1 : On-budget, 2 : Off-budget)"
      
responses:
  200:
    description: A list of accounts with the following information
    schema:
      $ref: '#/definitions/Account'
    examples:
      application/json:
        id: 987654
        name: My checking account
        balance: 134184,
        can_be_deleted: 0,
        status: 1,
        type: 1
