Returns an array of all accounts with information.
---
tags:
  - Account
responses:
  "200":
    description: A list of accounts with the following information
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: number
              description: The account number
              example: 9876541
            name:
              type: string
              description: The name of the account
              example: My checking account
            type:
              type: number
              description: "The type of account (1 : On-budget, 2 : Off-budget)"
              example: 1
            status:
              type: number
              description: "The account status (1 : Open, 0 : Closed)"
              example: 1
            balance:
              type: number
              description: The account balance in cents
              example: 50000
            can_be_deleted:
              type: number
              description: A boolean indicating if the account can be deleted
              example: 0
  "401":
    description: No user is logged in
  "500":
    description: Internal server error
