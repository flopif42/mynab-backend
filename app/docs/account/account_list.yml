Returns an array of all accounts with information.
---
definitions:
  Account:
    type: object
    properties:
      id:
        type: integer
        description: The account number
      name:
        type: string
        description: The account name

tags:
  - Account
responses:
  200:
    description: A list of accounts with the following information
    schema:
      $ref: "#/definitions/Account"
    examples:
      account: { 987654, "Checking" }
  401:
    description: No user is logged in
  500:
    description: Internal server error
