Adds a new parent category.
---
tags:
  - Category
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        parent_category_name:
          type: string
          description: The name of the parent category
          example: Food
      required:
        - parent_category_name
responses:
  201:
    description: Parent category was created successfully
  400:
    description: Missing required parameters or incorrect parameters
  401:
    description: No user is logged in
