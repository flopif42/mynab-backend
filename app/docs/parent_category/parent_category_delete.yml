Deletes a parent category.
---
tags:
  - Category
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        id_parent:
          type: number
          description: The parent category ID number
          example: 856
      required:
        - id_parent
responses:
  204:
    description: Parent category was successfully deleted
  400:
    description: Missing required parameter or incorrect parameter
  401:
    description: No user is logged in
  403:
    description: Parent category doesn't belong to the logged in user
  404:
    description: Parent category doesn't exist
  409:
    description: Parent category could not be deleted because it has categories attached. All categories must be deleted first.
  