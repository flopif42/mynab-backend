Updates a transaction.
---
tags:
  - Transaction
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        id_transaction:
          type: number
          description: The ID of the transaction
          example: 4152
        id_account:
          type: number
          description: The ID of the account
          example: 987654
        id_payee:
          type: number
          description: The ID of the payee
          example: 581
        amount:
          type: number
          description: The transaction amount in cents
          example: 1299
        flow:
          type: number
          description: "The flow of the transaction (-1 : Outflow, 1 : Inflow)"
          example: -1
        date:
          type: string
          description: The transaction date in DD/MM/YYYY format
          example: 03/04/2025
        id_category:
          type: number
          description: The ID of the category for this transaction
          example: 23
        memo:
          type: string
          description: An optional memo for the transaction
          example: Subscription to Netflix
      required:
        - id_transaction
responses:
  204:
    description: Transaction was updated successfully
  400:
    description: Missing required parameters or incorrect parameters
  401:
    description: No user is logged in
