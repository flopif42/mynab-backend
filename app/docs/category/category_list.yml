Returns a list of all categories.
---
tags:
  - Category
definitions:
  Category:
    type: object
    properties:
      id:
        type: integer
        description: The category number
      name:
        type: string
        description: The category name
      id_parent:
        type: integer
        description: The ID of this category's parent
      can_be_deleted:
        type: integer
        description: A boolean indicating if the category can be deleted

  ParentCategory:
    type: object
    properties:
      id:
        type: integer
        description: The parent category number
      name:
        type: string
        description: The parent category name
      can_be_deleted:
        type: integer
        description: A boolean indicating if the parent category can be deleted
      position:
        type: integer
        description: An index corresponding to the parent category's position when displayed
      child_categories:
        type: array
        items:
          '#/definitions/Category'

responses:
  200:
    description: A list of parent categories and their respective child categories
    schema:
      $ref: '#/definitions/ParentCategory'
    examples:
      application/json:
        id: 4
        name: Food
        position: 5
        can_be_deleted: 0
        child_categories: x
  401:
    description: No user is logged in
