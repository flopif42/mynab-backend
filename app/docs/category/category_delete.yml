Deletes a category.
---
tags:
  - Category
consumes:
  - application/json
parameters:
  - name: id_category
    in: query
    required: true
    description: The ID of the category to delete

responses:
  204:
    description: Category was successfully deleted
  400:
    description: Missing required parameter or incorrect parameter
  401:
    description: No user is logged in
  404:
    description: Category doesn't exist
  409:
    description: Category could not be deleted because it has transactions attached. All transactions must be deleted first.
  